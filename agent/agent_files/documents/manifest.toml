# Document metadata — single source of truth for both backends.
# Consumed by script_configure_agents.py:
#   - Anthropic: title + description are baked into per-doc content blocks at runtime.
#   - Mistral: title is used as the document name on upload; descriptions roll
#     up into the library description (the SDK has no per-doc description hook).
#
# Section name is arbitrary; the `file` field is what's matched against the
# documents list in script_configure_agents.py.

[getting_started]
file = "getting_started.md"
title = "Getting Started with the Robot"
description = "The first activity (no biology): building the robot, pairing the wireless dongle, connecting in mBlock, the basic program structure, two first programs (blink the LEDs; blink when the light sensor reads below 500, introducing variables), and challenges using the sonar and gyroscope."

[robot_details]
file = "robot_details.md"
title = "mBot Ranger — Hardware, Setup, and Connection Reference"
description = "Hardware specs (ports, sensors, motors), how to connect the mBot Ranger to mBlock, and troubleshooting for cables, motors, and sensor placement."

[programming_blocks]
file = "programming_blocks.md"
title = "mBlock Programming Block Reference"
description = "Reference for the mBlock visual programming blocks BME students use: action, sensor, and control-flow blocks."

[faculty_and_staff]
file = "faculty_and_staff.md"
title = "BME Faculty and Staff Directory"
description = "Who runs the BME program and who to contact about specific issues."

[color_vision]
file = "color_vision.md"
title = "Color Vision — Biology and Robot Activities"
description = "Biology of color vision; the human color-discrimination goggle game (a deployed web app with a color trainer and a timed, scored group competition with team leaderboard); the robot color-discrimination challenge (filtered light sensors as a 1-pixel color camera — a dichromatic two-sensor build by default, like a dog, extendable to trichromatic RGB); two local HTML web games (RGB Codebreaker for additive mixing, Color Constancy Challenge for context-dependent perception)."

[olfaction]
file = "olfaction.md"
title = "Olfaction and Odor-Guided Behavior"
description = "Biology of olfaction; termite trail-following observation; robot line-following as a model of odor-guided movement."

[sonar]
file = "sonar.md"
title = "Sonar and Echolocation"
description = "Biology of echolocation; sensor directionality; obstacle-avoidance robot; sonar-cane activity."

[touch_whiskers]
file = "touch_whiskers.md"
title = "Touch, Whiskers, and Mechanical Whisker Sensing"
description = "Biology of touch and whiskers; two-point discrimination test; robot whisker activity using flex sensors; active sensing."

[sound_localization]
file = "sound_localization.md"
title = "Sound Localization — Biology and Robot Activity"
description = "Biology of sound localization (two ears, pinnae, interaural level differences); the robot challenge of approaching a pulsed-sound speaker using a directional external ear made of paper or clay; the phasic, omnidirectional, loudness-only sound sensor; two builds — a one-eared robot that rotates and compares loudness across turns, and a two-eared robot that compares left vs. right; calibrating ear directionality, averaging noisy measurements, and an optional stop-at-the-target extension."
